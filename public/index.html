<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express + Socket.IO na Vercel</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://socket.io"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-lg bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl overflow-hidden">
    
    <!-- Cabeçalho -->
    <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
      <div>
        <h1 class="font-semibold text-lg">Express + Socket.IO</h1>
        <p class="text-xs text-zinc-400">Vercel Functions</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="checkApi()" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-2.5 py-1 rounded-md transition">
          Testar API REST
        </button>
        <span id="status-badge" class="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Conectando
        </span>
      </div>
    </div>

    <!-- Área de Mensagens -->
    <div id="messages" class="h-80 overflow-y-auto p-4 space-y-3 text-sm"></div>

    <!-- Input -->
    <form id="chat-form" class="p-3 border-t border-zinc-800 flex gap-2 bg-zinc-900/50">
      <input
        id="msg-input"
        type="text"
        placeholder="Digite uma mensagem em tempo real..."
        autocomplete="off"
        class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500"
      />
      <button
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition cursor-pointer"
      >
        Enviar
      </button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const badgeEl = document.getElementById('status-badge');
    const formEl = document.getElementById('chat-form');
    const inputEl = document.getElementById('msg-input');

    // Conecta forçando WebSocket puro (reconexão já é automática no Socket.IO)
    const socket = io({
      transports: ['websocket']
    });

    function addMessage(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(connected) {
      if (connected) {
        badgeEl.className = 'flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400';
        badgeEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online';
      } else {
        badgeEl.className = 'flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400';
        badgeEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span> Reconectando...';
      }
    }

    socket.on('connect', () => setStatus(true));
    socket.on('disconnect', () => setStatus(false));

    socket.on('system', (text) => {
      addMessage(`<div class="text-center text-xs text-zinc-500 my-1">${text}</div>`);
    });

    socket.on('chat-message', (data) => {
      addMessage(`
        <div class="bg-zinc-800/70 border border-zinc-800 rounded-xl p-2.5">
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span class="font-medium text-indigo-400">${data.sender}</span>
            <span>${data.time}</span>
          </div>
          <p class="text-zinc-100 break-words">${data.text}</p>
        </div>
      `);
    });

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (text && socket.connected) {
        socket.emit('chat-message', text);
        inputEl.value = '';
      }
    });

    async function checkApi() {
      const res = await fetch('/api/status');
      const data = await res.json();
      addMessage(`<div class="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-900 p-2 rounded-lg font-mono">GET /api/status → ${JSON.stringify(data)}</div>`);
    }
  </script>
</body>
</html>
